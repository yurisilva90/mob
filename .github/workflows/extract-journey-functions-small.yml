name: Extract journey functions small
on:
  push:
    paths:
      - '.github/workflows/extract-journey-functions-small.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/extract_journey_functions_small.py
      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _journey_functions_small.txt
          git commit -m 'Extract small journey functions' || exit 0
          git push
# trigger
