name: Inspecionar revisão e Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-review-cards.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar trechos relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          keys=[
            'data_quality_flag',
            'Suspeita',
            'suspeita',
            'aguardando confirmação',
            'Aguardando confirmação',
            'aguardando revisão',
            'Aguardando revisão',
            'Iniciar Jornada',
            'Metas',
            'renderContinuousStatusBars',
            'journeyBreakdownForSession',
            'loadAutoTripsForOperationalDay',
            'journeyAutoCache'
          ]
          seen=set()
          for key in keys:
            print('\n===== KEY:',key,'=====')
            hits=[i for i,x in enumerate(lines) if key in x]
            print('hits', len(hits))
            for i in hits[:30]:
              a=max(0,i-18); b=min(len(lines),i+45)
              sig=(a,b)
              if sig in seen: continue
              seen.add(sig)
              print(f'--- {a+1}-{b} ---')
              for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
