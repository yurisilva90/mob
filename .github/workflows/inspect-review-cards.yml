name: Inspecionar revisão e Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-review-cards.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvar ocorrências relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          keys=[
            'data_quality_flag','Suspeita','suspeita','Aguardando confirmação','Aguardando revisão',
            'Iniciar Jornada','Metas','renderContinuousStatusBars','journeyBreakdownForSession',
            'loadAutoTripsForOperationalDay','journeyAutoCache','renderJornada'
          ]
          out=[]
          for key in keys:
            out.append(f'===== {key} =====')
            for i,x in enumerate(lines,1):
              if key in x:
                out.append(f'{i}: {x[:700]}')
          Path('.tmp-review-hits.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit da inspeção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-review-hits.txt
          git diff --cached --quiet || git commit -m "chore: registrar ocorrências temporárias"
          git push
