name: Inspecionar revisão e Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-review-cards.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvar trechos relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          keys=[
            'data_quality_flag',
            'Suspeita',
            'suspeita',
            'aguardando confirmação',
            'Aguardando confirmação',
            'aguardando revisão',
            'Aguardando revisão',
            'Iniciar Jornada',
            'Metas',
            'renderContinuousStatusBars',
            'journeyBreakdownForSession',
            'loadAutoTripsForOperationalDay',
            'journeyAutoCache',
            'renderJornada'
          ]
          out=[]
          covered=[]
          for key in keys:
            hits=[i for i,x in enumerate(lines) if key in x]
            out.append(f'\n===== KEY: {key} | hits={len(hits)} =====')
            for i in hits[:50]:
              a=max(0,i-12); b=min(len(lines),i+28)
              if any(a>=x and b<=y for x,y in covered):
                continue
              covered.append((a,b))
              out.append(f'--- {a+1}-{b} ---')
              out.extend(f'{n+1}: {lines[n]}' for n in range(a,b))
          Path('.tmp-review-inspect.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit da inspeção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-review-inspect.txt
          git diff --cached --quiet || git commit -m "chore: registrar inspeção temporária"
          git push
