name: Corrigir Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-review-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 .tmp-patch-review-cards.py
      - name: Validar
        run: |
          grep -q "Aguardando revisão" index.html
          grep -q "Aguardando confirmação" index.html
          test "$(grep -o 'data_quality_flag' index.html | wc -l)" -eq 1
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: incluir corridas em revisão nos cards da Jornada"
          git push
