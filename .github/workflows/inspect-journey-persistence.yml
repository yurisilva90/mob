name: Inspect journey persistence
on:
  push:
    paths:
      - '.github/workflows/inspect-journey-persistence.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/inspect_journey_persistence.py
      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _journey_persistence_probe.txt
          git commit -m 'Capture journey persistence context' || exit 0
          git push
