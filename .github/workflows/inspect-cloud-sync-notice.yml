name: Inspect cloud sync notice
on:
  push:
    paths:
      - '.github/workflows/inspect-cloud-sync-notice.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract sync notice context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          low=s.lower()
          terms=['sincron','nuvem','cloud','sync']
          spans=[]
          for term in terms:
              pos=0
              while True:
                  i=low.find(term,pos)
                  if i<0: break
                  a=max(0,i-500); b=min(len(s),i+900)
                  spans.append((i,term,s[a:b]))
                  pos=i+len(term)
          out=[]
          seen=set()
          for i,term,ctx in sorted(spans):
              key=(i,term)
              if key in seen: continue
              seen.add(key)
              out.append(f'\n===== {term} @ {i} =====\n{ctx}\n')
          Path('_sync_notice_probe.txt').write_text(''.join(out),encoding='utf-8')
          print(f'{len(out)} ocorrencias')
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _sync_notice_probe.txt
          git commit -m "Capture cloud sync notice context"
          git push
