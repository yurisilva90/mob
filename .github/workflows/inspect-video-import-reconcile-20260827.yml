name: Inspect video import reconciliation matching
on:
  push:
    paths:
      - '.github/workflows/inspect-video-import-reconcile-20260827.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant video reconciliation code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=['function resolveTimeConflicts','sameTimeCandidates','toUpdateAuto','toPushAuto','async function confirmImport','function confirmImport']
          for needle in needles:
            print('\n===== '+needle+' =====')
            pos=s.find(needle)
            print('position',pos)
            if pos>=0:
              print(s[max(0,pos-3500):pos+9000])
          PY
