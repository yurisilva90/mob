name: Inspecionar flicker Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-flicker.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar trechos relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          keys=[
            'aguardando confirmação',
            'pendingCount',
            'computeStatusBreakdown(',
            "setHTML('jc-bar'",
            "setHTML('td-bd-bar'",
            'async function loadAutoTripsForDay',
            'function renderJornada',
            'JOURNEY_CONTINUOUS_OPERATIONAL_V3',
            'ensureJourneyStatus',
            'renderContinuousStatusBars',
            'previousRenderJornada'
          ]
          seen=set()
          for key in keys:
            print('\n===== KEY:',key,'=====')
            hits=[i for i,x in enumerate(lines) if key in x]
            for i in hits[:12]:
              a=max(0,i-18); b=min(len(lines),i+45)
              sig=(a,b)
              if sig in seen: continue
              seen.add(sig)
              print(f'--- {a+1}-{b} ---')
              for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
