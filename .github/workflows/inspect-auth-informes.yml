name: Inspect auth and informes
on:
  push:
    paths:
      - '.github/workflows/inspect-auth-informes.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          low=s.lower()
          terms=['signinwithpassword','sign_in','login','sm_inf_city','renderinformes','infescolhercidade','infcarregarvenuesgps','navigator.geolocation','inf-city-name','city:\'rio\'','city:"rio"']
          out=[]
          seen=[]
          for term in terms:
              pos=0
              while True:
                  i=low.find(term.lower(),pos)
                  if i<0: break
                  if all(abs(i-j)>200 for j in seen):
                      a=max(0,i-1200); b=min(len(s),i+2200)
                      out.append(f'\n===== {term} @ {i} =====\n{s[a:b]}\n')
                      seen.append(i)
                  pos=i+len(term)
          Path('_auth_informes_probe.txt').write_text(''.join(out),encoding='utf-8')
          print(f'{len(out)} contexts')
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _auth_informes_probe.txt
          git commit -m "Capture auth and informes contexts"
          git push
