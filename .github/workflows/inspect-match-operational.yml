name: Inspecionar matching operacional
on:
  push:
    paths: ['.github/workflows/inspect-match-operational.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -A90 -B10 "function matchAutoTrip" index.html || true
          grep -n -A70 -B10 "function autoCorridasDateRange" index.html || true
