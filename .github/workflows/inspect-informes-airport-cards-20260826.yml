name: Inspect Informes airport cards
on:
  push:
    paths:
      - '.github/workflows/inspect-informes-airport-cards-20260826.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract card block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('Galeão (GIG)')
          if i<0: raise SystemExit('GIG not found')
          a=max(0,i-5000); b=min(len(s),i+9000)
          Path('_informes_airport_cards_probe.txt').write_text(s[a:b],encoding='utf-8')
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _informes_airport_cards_probe.txt
          git commit -m "Capture Informes airport cards" || exit 0
          git push
