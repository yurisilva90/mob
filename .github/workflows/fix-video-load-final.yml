name: Corrigir carregamento de video
on:
  push:
    paths:
      - '.github/workflows/fix-video-load-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 .tmp-fix-video.py
      - name: Validar e publicar
        run: |
          grep -q "Salvando vídeo para conferência" index.html
          grep -q "const frameDrawn = await new Promise" index.html
          grep -q "requestVideoFrameCallback" index.html
          grep -q "reject(e instanceof Error" index.html
          if grep -q "videoUploads.push(uploadImportVideo" index.html; then exit 1; fi
          rm -f .tmp-fix-video.py .tmp-current-video.txt .github/workflows/fix-video-load-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: estabilizar carregamento de vídeo no celular"
          git push
