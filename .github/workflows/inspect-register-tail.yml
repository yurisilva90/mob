name: Inspect registration tail
on:
  push:
    paths:
      - '.github/workflows/inspect-register-tail.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          i=s.find('async function loginRegister()')
          Path('_register_tail_probe.txt').write_text(s[i:i+7000] if i>=0 else 'NOT FOUND',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _register_tail_probe.txt
          git commit -m "Capture registration flow context"
          git push
