name: Corrigir atualização dos KPIs de corridas automáticas
on:
  push:
    paths:
      - '.github/workflows/fix-live-auto-trip-kpis-20260827.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python3 .github/scripts/patch_live_auto_trip_kpis_20260827.py
      - name: Validar correção
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'autoTripsAge >= 15000' in s
          assert 'autoTripsReady || autoTripsHoje.length > 0 || legacyTripsHoje.length > 0' in s
          assert "mob-v26-live-auto-kpi-refresh" in Path('sw.js').read_text(encoding='utf-8')
          print('Validação da correção concluída.')
          PY
      - name: Gravar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Refresh automatic trips in Journey KPIs'
          git push
