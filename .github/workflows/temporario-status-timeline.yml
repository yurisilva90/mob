name: Aplicar timeline persistente da jornada

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: aplicar timeline persistente da jornada' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar patch
        run: |
          python3 .github/patch-status-timeline.py
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git rm .github/patch-status-timeline.py .github/workflows/temporario-status-timeline.yml .github/trigger-status-timeline.txt
          git add index.html
          git commit -m "feat: persistir e exibir status real das jornadas"
          git push origin HEAD:main
