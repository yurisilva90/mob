name: Inspecionar regras de jornada
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-operational-day.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar trechos relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['splitPostStopMidnight','midnight','_midnight','openImportPrecheck','confirmImport','loadAutoTripsForDay','autoTripsPool','import_videos','sessionItem(','function gpsStop','function gpsUpdate','function restoreGpsSession','function reconcileSessionsForDay']
          lines=s.splitlines()
          seen=set()
          for key in keys:
              print('\n===== KEY:',key,'=====')
              hits=[i for i,l in enumerate(lines) if key in l]
              for i in hits[:12]:
                  a=max(0,i-12); b=min(len(lines),i+35)
                  tag=(a,b)
                  if tag in seen: continue
                  seen.add(tag)
                  print(f'--- lines {a+1}-{b} ---')
                  for n in range(a,b): print(f'{n+1}: {lines[n]}')
          PY
