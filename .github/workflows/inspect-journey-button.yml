name: Corrigir botão Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-journey-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python3 .tmp-fix-journey-button.py
      - name: Validar e publicar
        run: |
          grep -q 'const cardDate = day?.date || S.curDate || DB.today();' index.html
          grep -q 'id="jc-actions"' index.html
          grep -q 'onclick="gpsStart()"' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: restaurar botão de iniciar Jornada"
          git push
          # execução final após ajuste de validação
