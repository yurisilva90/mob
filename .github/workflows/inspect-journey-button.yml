name: Inspecionar botão Jornada
on:
  push:
    paths:
      - '.github/workflows/inspect-journey-button.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair estado GPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          pats=[r'\bgps\s*:',r'\bgps\s*=',r'S\.gps\.st\s*=',r'\bst\s*:',r'function gpsStart',r'function gpsStop',r'function confirmStop',r'jc-actions',r'j-actions']
          out=[]
          for p in pats:
            rx=re.compile(p)
            hits=[(i+1,x) for i,x in enumerate(lines) if rx.search(x)]
            out.append(f'===== {p} hits={len(hits)} =====')
            out.extend(f'{i}: {x[:1200]}' for i,x in hits[:200])
          Path('.tmp-journey-button.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspeção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-journey-button.txt
          git diff --cached --quiet || git commit -m "chore: inspecionar estado GPS da Jornada"
          git push
