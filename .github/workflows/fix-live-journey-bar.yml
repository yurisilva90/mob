name: Fix live journey bar
on:
  push:
    paths:
      - '.github/workflows/fix-live-journey-bar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""  // Compatibilidade apenas: V3 abaixo é o único renderizador automático.\n  window.renderStatusTimeline=renderStatusTimeline;"""
          new="""  // Compatibilidade apenas: V3 abaixo é o único renderizador automático.\n  // Expõe somente o vínculo da sessão nativa para o V3 poder garantir que\n  // uma Jornada recém-iniciada comece a gravar Online/Buscar/Corrida mesmo\n  // sem depender do renderizador legado da barra.\n  window.ensureNativeJourneySession=ensureNativeJourneySession;\n  window.renderStatusTimeline=renderStatusTimeline;"""
          if s.count(old)!=1:
              raise SystemExit(f'expor binder: esperado 1, encontrado {s.count(old)}')
          s=s.replace(old,new,1)

          old="""    if(c&&c.rows&&c.rows.length) return statusBreakdownRows(c.rows,elapsedSec,kmTotal,null,null,(S?.gps?.st==='running'?S.gps.sessionId:null));\n    if(!c || c.loading) return {total:0,online:{sec:0,km:0,pct:0},buscando:{sec:0,km:0,pct:0},corrida:{sec:0,km:0,pct:0}};\n    return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);"""
          new="""    if(c&&c.rows&&c.rows.length) return statusBreakdownRows(c.rows,elapsedSec,kmTotal,null,null,(S?.gps?.st==='running'?S.gps.sessionId:null));\n    // Jornada ativa nunca some enquanto a timeline chega: sem trechos ainda,\n    // todo o tempo/km conhecido fica como Online e depois é redistribuído\n    // quando Buscar/Corrida forem registrados.\n    if(!c || c.loading) return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);\n    return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);"""
          if s.count(old)!=1:
              raise SystemExit(f'fallback loading: esperado 1, encontrado {s.count(old)}')
          s=s.replace(old,new,1)

          old="""    if(S?.gps?.st==='running'&&S.gps.sessionId){\n      const sess={id:S.gps.sessionId,start:S.gps.start,end:null,km:S.gps.km||0,elapsed:getElapsed()};\n      ensureJourneyStatus(sess);\n      const c2=journeyStatusCache.get(journeyKey(sess));\n      if(c2?.rows?.length){\n        const bd=journeyBreakdownForSession(sess,getElapsed(),S.gps.km||0,[]);\n        if(jcRow)jcRow.style.display='';\n        try{setHTML('jc-bar',buildSbarHtml(bd));setHTML('jc-blist',buildSrowsHtml(bd));}catch(e){}\n      } else if(c2 && !c2.loading && jcRow) {\n        jcRow.style.display='none';\n      }\n    } else if(jcRow) {"""
          new="""    if(S?.gps?.st==='running'&&S.gps.sessionId){\n      const sess={id:S.gps.sessionId,start:S.gps.start,end:null,km:S.gps.km||0,elapsed:getElapsed()};\n      // Garante o vínculo com JourneyStatusTracker mesmo que o renderizador\n      // legado esteja desativado. Isso faz a timeline nativa começar a gravar.\n      try{ if(typeof window.ensureNativeJourneySession==='function') window.ensureNativeJourneySession(); }catch(e){}\n      ensureJourneyStatus(sess);\n      const bd=journeyBreakdownForSession(sess,getElapsed(),S.gps.km||0,[]);\n      // Enquanto não existe trecho detalhado, o fallback acima mostra 100%\n      // Online. Jornada ativa nunca deve esconder a barra.\n      if(jcRow)jcRow.style.display='';\n      try{setHTML('jc-bar',buildSbarHtml(bd));setHTML('jc-blist',buildSrowsHtml(bd));}catch(e){}\n    } else if(jcRow) {"""
          if s.count(old)!=1:
              raise SystemExit(f'barra ativa: esperado 1, encontrado {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-live-journey-bar.yml').unlink(missing_ok=True)
          PY
      - name: Validar e publicar
        run: |
          grep -q "window.ensureNativeJourneySession=ensureNativeJourneySession" index.html
          grep -q "Jornada ativa nunca deve esconder a barra" index.html
          grep -q "if(!c || c.loading) return computeStatusBreakdown" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: manter barra da Jornada ativa e vincular timeline"
          git push
