name: Apply video reconciliation fix
on:
  push:
    paths:
      - '.github/workflows/apply-video-reconcile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_video_reconcile_20260826.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for i,b in enumerate(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              Path(f'/tmp/mob-{i}.js').write_text(b)
          PY
          for f in /tmp/mob-*.js; do node --check "$f"; done
          grep -q 'await Promise.all(importWrites)' index.html
          grep -q 'function dedupeVideoHistoryTrips' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix video reconciliation dedupe and refresh'
          git push