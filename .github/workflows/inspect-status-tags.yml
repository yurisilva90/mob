name: Finalizar status e tags das corridas
on:
  push:
    paths:
      - '.github/workflows/inspect-status-tags.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste final
        run: python3 .tmp-finalize-trip-status.py
      - name: Validar e publicar
        run: |
          grep -q "capture_source === 'importada'" index.html
          grep -q "Aguardando confirmação" index.html
          grep -q "capture_source: 'importada'" index.html
          grep -q "status: 'confirmada'" index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert "statusTxt = t.status==='confirmada' ? 'Confirmada' : 'Aguardando confirmação'" in s
          assert "pendingCount = autoTripsHoje.filter(t => t.status !== 'confirmada' || t.value_needs_review === true).length" in s
          Path('.tmp-finalize-trip-status.py').unlink(missing_ok=True)
          Path('.tmp-status-tags.txt').unlink(missing_ok=True)
          Path('.tmp-status-precise.txt').unlink(missing_ok=True)
          Path('.github/workflows/inspect-status-tags.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat: simplificar confirmação e origem das corridas"
          git push
