name: Restaurar importar corridas
on:
  push:
    paths:
      - '.github/workflows/restore-import-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar botão
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="section" style="padding:16px 16px 8px"><h2>Total do dia</h2></div>'
          new='<div class="section" style="padding:16px 16px 8px"><h2>Total do dia</h2><button class="add" onclick="openImportPrecheck()"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-1px;margin-right:3px"><path d="M12 5v14M5 12h14"/></svg>Importar corridas</button></div>'
          if old not in s:
              raise SystemExit('header Total do dia não encontrado ou já alterado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/restore-import-button.yml').unlink(missing_ok=True)
          PY
      - name: Validar e publicar
        run: |
          grep -q '>Importar corridas</button></div>' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: restaurar botão Importar corridas na Jornada"
          git push
