name: Corrigir travamento importacao de video
on:
  push:
    paths:
      - '.github/workflows/fix-video-import-stall.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir pipeline de video
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def one(old,new,label):
            global s
            n=s.count(old)
            if n != 1:
              raise SystemExit(f'{label}: esperado 1, encontrado {n}')
            s=s.replace(old,new,1)

          # 1) Mostrar progresso enquanto os quadros ainda estao sendo preparados.
          one(
            "      updateRing('Analisando vídeo ' + dot, false);\n      const frames = await extractVideoFrames(videos[v]);",
            "      updateRing('Preparando vídeo ' + dot, false);\n      const frames = await extractVideoFrames(videos[v], (done, total) => {\n        updateRing('Preparando vídeo · ' + done + '/' + total + ' quadros ' + dot, false);\n      });",
            'progresso preparacao'
          )

          one(
            "        updateRing('Analisando vídeo ' + dot, false);",
            "        updateRing('Analisando vídeo · ' + (i+1) + '/' + frames.length + ' quadros ' + dot, false);",
            'progresso analise'
          )

          # 2) Callback de progresso no extrator.
          one(
            'async function extractVideoFrames(file) {',
            'async function extractVideoFrames(file, onProgress) {',
            'assinatura extrator'
          )

          # Metadata nao pode deixar a Promise eterna.
          anchor="""    video.preload    = 'auto';

    video.onloadedmetadata = async () => {"""
          replacement="""    video.preload    = 'auto';

    const metadataTimer = setTimeout(() => {
      try{document.body.removeChild(video);}catch(e){}
      URL.revokeObjectURL(url);
      reject(new Error('O vídeo demorou demais para ser preparado. Tente novamente.'));
    }, 15000);

    video.onloadedmetadata = async () => {
      clearTimeout(metadataTimer);"""
          one(anchor,replacement,'timeout metadata')

          # O bug principal: instalar onseeked ANTES de mudar currentTime.
          old_seek="""            // Timeout fallback — some browsers never fire onseeked
            const timer = setTimeout(() => {
              try { ctx.drawImage(video, 0, 0, canvas.width, canvas.height); } catch(e) {}
              res();
            }, 4000);
            video.currentTime = time;
            video.onseeked = () => {
              clearTimeout(timer);
              try { ctx.drawImage(video, 0, 0, canvas.width, canvas.height); } catch(e) {}
              res();
            };"""
          new_seek="""            // Registra o handler ANTES do seek. Em arquivos locais o seek
            // pode terminar imediatamente; antes o evento era perdido e cada
            // quadro aguardava o fallback inteiro de 4 segundos.
            let done = false;
            const finishSeek = () => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              video.onseeked = null;
              try { ctx.drawImage(video, 0, 0, canvas.width, canvas.height); } catch(e) {}
              res();
            };
            const timer = setTimeout(finishSeek, 1500);
            video.onseeked = finishSeek;
            video.currentTime = time;"""
          one(old_seek,new_seek,'ordem seek')

          # Transformar loop para permitir callback X/Y.
          one(
            '      for (const time of times) {',
            '      if (typeof onProgress === \'function\') onProgress(0, times.length);\n      for (let timeIndex = 0; timeIndex < times.length; timeIndex++) {\n        const time = times[timeIndex];',
            'loop progresso'
          )
          one(
            "        } catch(e) { console.warn('Frame t='+time, e); }\n      }",
            "        } catch(e) { console.warn('Frame t='+time, e); }\n        if (typeof onProgress === 'function') onProgress(timeIndex + 1, times.length);\n      }",
            'callback progresso'
          )

          # Limpar timer de metadata tambem no erro nativo.
          one(
            "    video.onerror = (e) => {\n      try{document.body.removeChild(video);}catch(e2){}",
            "    video.onerror = (e) => {\n      clearTimeout(metadataTimer);\n      try{document.body.removeChild(video);}catch(e2){}",
            'limpeza metadata'
          )

          # 3) A chamada de IA tambem nao pode aguardar rede indefinidamente.
          pattern=re.compile(r"  const resp = await fetch\('https://smartmobi-proxy\.yurisilva1990\.workers\.dev', \{\n    method:'POST', headers:\{'Content-Type':'application/json'\},\n    body: JSON\.stringify\(\{model:'claude-haiku-4-5-20251001', max_tokens:1500,\n      messages:\[\{role:'user', content:\[\{type:'image',source:\{type:'base64',media_type:mt,data:b64\}\},\{type:'text',text:prompt\}\]\}\]\}\)\n  \}\);")
          m=pattern.search(s)
          if not m:
            raise SystemExit('fetch da IA nao encontrado')
          new_fetch="""  const requestController = new AbortController();
  const requestTimer = setTimeout(() => requestController.abort(), 25000);
  let resp;
  try {
    resp = await fetch('https://smartmobi-proxy.yurisilva1990.workers.dev', {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:requestController.signal,
      body: JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:1500,
        messages:[{role:'user', content:[{type:'image',source:{type:'base64',media_type:mt,data:b64}},{type:'text',text:prompt}]}]})
    });
  } catch(e) {
    if (e && e.name === 'AbortError') throw new Error('Tempo esgotado ao analisar quadro');
    throw e;
  } finally {
    clearTimeout(requestTimer);
  }"""
          s=s[:m.start()]+new_fetch+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar e publicar
        run: |
          grep -q "async function extractVideoFrames(file, onProgress)" index.html
          grep -q "video.onseeked = finishSeek" index.html
          grep -q "video.currentTime = time" index.html
          grep -q "Preparando vídeo ·" index.html
          grep -q "requestController.abort(), 25000" index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.index('video.onseeked = finishSeek') < s.index('video.currentTime = time', s.index('video.onseeked = finishSeek'))
          Path('.tmp-video-import.txt').unlink(missing_ok=True)
          Path('.github/workflows/inspect-video-import.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-video-import-stall.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: evitar travamento na análise de vídeo"
          git push
