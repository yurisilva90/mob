name: Ajuste Jornada

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ajustar:
    if: "${{ github.event.head_commit.message == 'chore: executar ajuste Jornada' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar ajuste
        shell: bash
        run: |
          python3 .github/patch_journey.py
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes."
            exit 0
          fi
          git commit -m "feat: aviso de permissões do MōB Flash na Jornada"
          git push origin HEAD:main
