name: Ajuste temporario Jornada

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ github.event.head_commit.message == 'chore: rotina temporária do aviso da Jornada' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar aviso de permissoes na Jornada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- JOURNEY_FLASH_PERMISSION_WARNING_V1 -->'
          if marker not in html:
              injection = base64.b64decode('').decode('utf-8')
              if '</body>' not in html:
                  raise SystemExit('Nao encontrei </body> em index.html')
              head, tail = html.rsplit('</body>', 1)
              path.write_text(head + injection + '\n</body>' + tail, encoding='utf-8')
              print('Ajuste aplicado em index.html')
          else:
              print('Ajuste ja aplicado')
          PY

          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes para publicar."
            exit 0
          fi
          git commit -m "feat: aviso de permissões do MōB Flash na Jornada"
          git push origin HEAD:main
