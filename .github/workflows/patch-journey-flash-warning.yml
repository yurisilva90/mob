name: Patch Journey Flash Warning

on:
  push:
    branches:
      - fix/journey-flash-warning

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: aviso de permissões do MōB Flash na Jornada'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/journey-flash-warning
          fetch-depth: 0

      - name: Aplicar ajuste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- JOURNEY_FLASH_PERMISSION_WARNING_V1 -->'
          if marker in html:
              print('Ajuste já aplicado.')
          else:
              injection = r'''
<!-- JOURNEY_FLASH_PERMISSION_WARNING_V1 -->
<script>
(function(){
  function isJourneyFlashNative(){
    try { return typeof isNativeApp === 'function' && isNativeApp() && typeof SmartMobiNative !== 'undefined'; }
    catch(e){ return false; }
  }

  function journeyFlashPermissionState(){
    if(!isJourneyFlashNative()) return null;
    try{
      const state = {
        a11y: !!SmartMobiNative.isA11yEnabled(),
        overlay: !!SmartMobiNative.hasOverlay(),
        capture: !!SmartMobiNative.isScreenCaptureActive()
      };
      state.missing = [];
      if(!state.a11y) state.missing.push('Acessibilidade');
      if(!state.overlay) state.missing.push('Sobrepor outros apps');
      if(!state.capture) state.missing.push('Leitura da tela');
      return state;
    }catch(e){ return null; }
  }

  function ensureJourneyFlashWarning(){
    let el = document.getElementById('journey-flash-warning');
    if(el) return el;
    const card = document.getElementById('journey-card');
    if(!card || !card.parentNode) return null;

    el = document.createElement('button');
    el.type = 'button';
    el.id = 'journey-flash-warning';
    el.setAttribute('aria-label','Abrir permissões do MōB Flash');
    el.style.cssText = 'display:none;width:calc(100% - 32px);margin:0 16px 12px;padding:12px 14px;border:1px solid #FDBA74;border-radius:16px;background:#FFF7ED;box-shadow:0 3px 12px rgba(154,52,18,.08);text-align:left;cursor:pointer;touch-action:manipulation;font-family:inherit;align-items:center;gap:11px;color:#9A3412';
    el.innerHTML = '<span style="width:34px;height:34px;border-radius:11px;background:#FFEDD5;display:flex;align-items:center;justify-content:center;flex:0 0 34px">'+
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.6 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/></svg></span>'+
      '<span style="flex:1;min-width:0"><strong style="display:block;font-size:12.5px;font-weight:800;line-height:1.35;color:#9A3412">MōB Flash precisa de atenção</strong><span id="journey-flash-warning-sub" style="display:block;font-size:10.8px;font-weight:600;line-height:1.4;color:#C2410C;margin-top:2px"></span></span>'+
      '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;opacity:.7"><path d="M9 18l6-6-6-6"/></svg>';
    el.addEventListener('click', openJourneyFlashPermissions);
    card.parentNode.insertBefore(el, card);
    return el;
  }

  async function openJourneyFlashPermissions(){
    try{
      if(typeof _flashLoadDraft === 'function') await _flashLoadDraft();
      if(typeof flashWizardMode !== 'undefined') flashWizardMode = 'settings';
      if(typeof flashWizardOnComplete !== 'undefined') flashWizardOnComplete = null;
      if(typeof _flashWizardShowStep === 'function') _flashWizardShowStep(2);
      if(typeof renderFlashKpiList === 'function') renderFlashKpiList();
      if(typeof renderFlashPreview === 'function') renderFlashPreview();
      if(typeof renderFlashPerms === 'function') renderFlashPerms();
      if(typeof openMo === 'function') openMo('mo-flash');
    }catch(e){
      try{
        if(typeof openFlashConfig === 'function'){
          await openFlashConfig();
          if(typeof _flashWizardShowStep === 'function') _flashWizardShowStep(2);
          if(typeof renderFlashPerms === 'function') renderFlashPerms();
        }
      }catch(_e){}
    }
  }
  window.openJourneyFlashPermissions = openJourneyFlashPermissions;

  function renderJourneyFlashWarning(){
    const el = ensureJourneyFlashWarning();
    if(!el) return;

    let journeyActive = false;
    try { journeyActive = !!(S && S.gps && (S.gps.st === 'running' || S.gps.st === 'paused')); }
    catch(e){}
    if(!journeyActive){ el.style.display='none'; return; }

    const state = journeyFlashPermissionState();
    if(!state || state.missing.length === 0){ el.style.display='none'; return; }

    const sub = document.getElementById('journey-flash-warning-sub');
    if(sub){
      const n = state.missing.length;
      sub.textContent = n === 1
        ? state.missing[0] + ' está pendente. Toque para ativar.'
        : n + ' permissões estão pendentes. Toque para ativar.';
    }
    el.style.display='flex';
  }
  window.renderJourneyFlashWarning = renderJourneyFlashWarning;

  const originalGpsStart = window.gpsStart;
  if(typeof originalGpsStart === 'function'){
    window.gpsStart = function(){
      const result = originalGpsStart.apply(this, arguments);
      setTimeout(renderJourneyFlashWarning, 500);
      setTimeout(renderJourneyFlashWarning, 1200);
      return result;
    };
  }

  window.addEventListener('focus', function(){ setTimeout(renderJourneyFlashWarning, 250); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) setTimeout(renderJourneyFlashWarning, 250);
  });
  setInterval(function(){
    let active = false;
    try { active = !!(S && S.gps && (S.gps.st === 'running' || S.gps.st === 'paused')); } catch(e){}
    if(active) renderJourneyFlashWarning();
    else {
      const el = document.getElementById('journey-flash-warning');
      if(el) el.style.display='none';
    }
  }, 3000);

  setTimeout(renderJourneyFlashWarning, 900);
})();
</script>
'''
              if '</body>' not in html:
                  raise SystemExit('Não encontrei </body> em index.html')
              head, tail = html.rsplit('</body>', 1)
              html = head + injection + '\n</body>' + tail
              path.write_text(html, encoding='utf-8')
              print('Ajuste aplicado em index.html')
          PY

          rm -f .github/workflows/patch-journey-flash-warning.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat: aviso de permissões do MōB Flash na Jornada"
          git push origin HEAD:fix/journey-flash-warning
