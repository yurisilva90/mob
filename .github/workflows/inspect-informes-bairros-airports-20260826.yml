name: Inspect Informes neighborhoods and airports
on:
  push:
    paths:
      - '.github/workflows/inspect-informes-bairros-airports-20260826.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['INF_BAIRROS','infRenderBairrosTab','aeroporto','aeroportos','inf-vlist-aero','infAbrirVenue','INF_VENUES','infRenderNearbyVenueLists']
          out=[]
          for p in pats:
            for m in re.finditer(re.escape(p),s,re.I):
              a=max(0,m.start()-1800); b=min(len(s),m.start()+5000)
              out.append(f'\n===== {p} @ {m.start()} =====\n'+s[a:b]+'\n')
          Path('_informes_bairros_airports_probe.txt').write_text(''.join(out),encoding='utf-8')
          print('occurrences',len(out))
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _informes_bairros_airports_probe.txt
          git commit -m "Capture Informes neighborhoods and airports context" || exit 0
          git push
