name: Apply Flash Permissions UI
on:
  push:
    branches: [ main ]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          marker='      <div style="border:1px solid #E2E8F0;border-radius:14px;padding:4px 14px" id="flash-perms">\n'
          assert marker in s
          if 'id="flash-perm-location"' not in s:
              extra='''        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #F1F5F9">
          <div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:#0F172A">Localização</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">Mede km e registra os pontos reais de embarque e destino</div></div>
          <div id="flash-perm-location" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #F1F5F9">
          <div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:#0F172A">Bateria</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">Evita que o Android interrompa GPS e leitura em segundo plano</div></div>
          <div id="flash-perm-battery" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"></div>
        </div>
'''
              s=s.replace(marker, marker+extra, 1)

          s=s.replace('Lê a tela da 99/Uber quando a oferta chega','Identifica telas e estados da corrida na Uber/99',1)
          s=s.replace('Permite o card aparecer por cima da 99/Uber','Mostra o Flash e o status por cima da Uber/99',1)
          s=s.replace('A 99 mostra a oferta como imagem — precisa reativar a cada abertura do app','Completa dados da oferta que não vierem pelos eventos oficiais',1)

          cap='''        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0">
          <div style="flex:1">
            <div style="font-size:13.5px;font-weight:600;color:#0F172A">Leitura da tela</div>'''
          assert cap in s
          if 'id="flash-perm-notification"' not in s:
              notif='''        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #F1F5F9">
          <div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:#0F172A">Acesso às notificações</div><div style="font-size:11px;color:#94A3B8;margin-top:1px">Lê eventos oficiais da Uber/99 e identifica a plataforma da oferta</div></div>
          <div id="flash-perm-notification" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"></div>
        </div>
'''
              s=s.replace(cap, notif+cap, 1)

          preview='      <div id="flash-preview-wrap" style="background:#111318;border-radius:14px;padding:16px 10px;display:flex;justify-content:center;margin-bottom:14px"></div>'
          assert preview in s
          if 'id="flash-perm-warning"' not in s:
              warn='''      <div id="flash-perm-warning" onclick="openFlashPermissionSetup()" style="display:none;align-items:flex-start;justify-content:space-between;gap:10px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:14px;padding:11px 12px;margin-bottom:12px;cursor:pointer">
        <div style="min-width:0"><div style="font-size:12.5px;font-weight:800;color:#9A3412">⚠ MōB Flash precisa de ajustes</div><div id="flash-perm-warning-text" style="font-size:11px;color:#C2410C;line-height:1.35;margin-top:2px"></div></div>
        <span style="font-size:11px;font-weight:800;color:#9A3412;white-space:nowrap">Revisar ›</span>
      </div>
'''
              s=s.replace(preview,warn+preview,1)

          pat=r'function renderFlashPerms\(\) \{.*?\n\}\n\n// Ao voltar do Android Settings'
          m=re.search(pat,s,re.S)
          assert m
          funcs='''function mobFlashPermissionSnapshot() {
  const n = window.SmartMobiNative;
  function read(name) { if (!n || typeof n[name] !== 'function') return null; try { return !!n[name](); } catch (_) { return null; } }
  return {location:read('isLocationReady'),battery:read('isBatteryExempt'),a11y:read('isA11yEnabled'),overlay:read('hasOverlay'),notification:read('isNotificationAccessEnabled'),capture:read('isScreenCaptureActive')};
}
function mobMissingFlashPermissions() {
  const st=mobFlashPermissionSnapshot();
  const defs=[['location','Localização'],['battery','Bateria'],['a11y','Acessibilidade'],['overlay','Sobrepor outros apps'],['notification','Acesso às notificações'],['capture','Leitura da tela']];
  return defs.filter(x=>st[x[0]]===false).map(x=>x[1]);
}
function _mobPermissionWarningHtml(missing) {
  if (!missing.length) return '';
  const shown=missing.slice(0,3).join(', '), extra=missing.length>3?' e +'+(missing.length-3):'';
  return (missing.length===1?'1 autorização pendente':missing.length+' autorizações pendentes')+': '+shown+extra+'.';
}
function renderFlashPermissionWarnings() {
  const missing=mobMissingFlashPermissions(), txt=_mobPermissionWarningHtml(missing);
  const fw=document.getElementById('flash-perm-warning');
  if (fw) { fw.style.display=missing.length?'flex':'none'; const ft=document.getElementById('flash-perm-warning-text'); if(ft) ft.textContent=txt; }
  const jw=document.getElementById('journey-perm-warning');
  if (jw) { jw.style.display=missing.length?'flex':'none'; const jt=document.getElementById('journey-perm-warning-text'); if(jt) jt.textContent=txt+' Toque para ativar antes da próxima oferta.'; }
}
async function openFlashPermissionSetup() { await openFlashConfig(); _flashWizardShowStep(2); renderFlashPerms(); }
function renderFlashPerms() {
  const ids={location:['flash-perm-location','isLocationReady','openLocationSettings'],battery:['flash-perm-battery','isBatteryExempt','openBatterySettings'],a11y:['flash-perm-a11y','isA11yEnabled','openA11ySettings'],overlay:['flash-perm-overlay','hasOverlay','openOverlaySettings'],notification:['flash-perm-notification','isNotificationAccessEnabled','openNotificationAccessSettings'],capture:['flash-perm-capture','isScreenCaptureActive','requestScreenCapture']};
  const n=window.SmartMobiNative;
  function pillHtml(ok,fixCall){
    if(ok===null)return '<span style="font-size:11px;color:#94A3B8">— (app precisa atualizar)</span>';
    if(ok)return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#F0FDF4;color:#15803D">&#10003; Ativo</span>';
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#FEF3C7;color:#B45309">&bull; Pendente</span><button onclick="'+fixCall+'" style="font-size:11px;font-weight:800;color:#fff;background:#0A2F6B;border:0;border-radius:9px;padding:6px 11px">Ativar</button>';
  }
  Object.values(ids).forEach(v=>{const el=document.getElementById(v[0]);if(!el)return;let ok=null;if(n&&typeof n[v[1]]==='function'){try{ok=!!n[v[1]]();}catch(_){}}el.innerHTML=pillHtml(ok,'SmartMobiNative.'+v[2]+'()');});
  renderFlashPermissionWarnings();
}

// Ao voltar do Android Settings'''
          s=s[:m.start()]+funcs+s[m.end():]

          old="    if (mo && mo.classList.contains('on')) renderFlashPerms();"
          assert old in s
          s=s.replace(old,old+"\n    renderFlashPermissionWarnings();",1)

          needle="  const jc = document.getElementById('journey-card');\n  if (!jc) return;"
          assert needle in s
          if "permWarn.id = 'journey-perm-warning'" not in s:
              repl=needle+'''\n  let permWarn = document.getElementById('journey-perm-warning');
  if (!permWarn && jc.parentNode) {
    permWarn = document.createElement('div'); permWarn.id = 'journey-perm-warning'; permWarn.onclick = openFlashPermissionSetup;
    permWarn.style.cssText = 'display:none;align-items:flex-start;justify-content:space-between;gap:10px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:14px;padding:11px 12px;margin:0 0 10px;cursor:pointer';
    permWarn.innerHTML = '<div style="min-width:0"><div style="font-size:12.5px;font-weight:800;color:#9A3412">⚠ Funções do MōB incompletas</div><div id="journey-perm-warning-text" style="font-size:11px;color:#C2410C;line-height:1.35;margin-top:2px"></div></div><span style="font-size:11px;font-weight:800;color:#9A3412;white-space:nowrap">Ativar ›</span>';
    jc.parentNode.insertBefore(permWarn, jc);
  }
  renderFlashPermissionWarnings();'''
              s=s.replace(needle,repl,1)

          for token in ['flash-perm-location','flash-perm-battery','flash-perm-notification','journey-perm-warning','mobMissingFlashPermissions']:
              assert token in s
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm -f .github/workflows/apply-permission-warning.yml .github/workflows/inspect-flash-perms.yml
          git commit -m 'fix: avisar permissões pendentes antes das ofertas'
          git push
