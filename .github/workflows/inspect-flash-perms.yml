name: Apply Flash Permissions UI
on:
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_perm_patch.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm -f scripts/apply_perm_patch.py .github/workflows/apply-permission-warning.yml .github/workflows/inspect-flash-perms.yml
          git commit -m "fix: avisar permissões pendentes antes das ofertas"
          git push
