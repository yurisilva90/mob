name: Apply native video 1.3.9
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-native-video-139.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 .tmp-native-video-139.py
      - name: Validar
        run: |
          grep -q 'function extractVideoFramesNative' index.html
          grep -q 'SmartMobiNative.extractSelectedVideoFrames' index.html
          grep -q 'async function extractVideoFramesBrowser' index.html
          grep -q 'async function extractVideoFrames(file, onProgress)' index.html
      - name: Publicar e limpar temporários
        run: |
          rm -f .tmp-native-video-139.py .github/workflows/apply-native-video-139.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: usar decodificação nativa de vídeo no APK 1.3.9"
          git push
