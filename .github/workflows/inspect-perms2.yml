name: Inspect perms2
on:
  push:
    paths:
      - '.github/workflows/inspect-perms2.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perm-warning-ui
      - name: Extract exact functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          keys=['function renderFlashPerms','id="flash-perms','flash-step2','MōB Flash ativo','flash-preview']
          out=[]
          for k in keys:
              i=s.find(k)
              if i>=0: out.append('\n===== '+k+' =====\n'+s[max(0,i-1000):i+9000])
          Path('_perm_snippet2.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _perm_snippet2.txt
          git commit -m 'chore: detalhar trecho de permissões' || true
          git push origin HEAD:perm-warning-ui