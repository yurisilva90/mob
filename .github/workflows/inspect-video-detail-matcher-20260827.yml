name: Inspect video detail matcher
on:
  push:
    paths:
      - '.github/workflows/inspect-video-detail-matcher-20260827.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for needle in ['normalizeTime(d.time)','_enriched','details.forEach','const candidate = unique','let score = diff;']:
            print('\n---',needle,'---')
            pos=s.find(needle)
            print('pos',pos)
            if pos>=0: print(s[max(0,pos-1200):pos+2500])
          PY
