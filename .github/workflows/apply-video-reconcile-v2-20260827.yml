name: Apply video reconciliation v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_video_reconcile_v2_20260827.py'
      - 'tools/test_video_reconcile_20260827.js'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python tools/fix_video_reconcile_v2_20260827.py
      - name: Validate functional rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'same_minute_resolution':'const out = [];' in s and 'function resolveTimeConflicts(list)' in s,
            'same_time_candidate_matching':'const sameTimeCandidates = dTime ? unique.filter' in s,
            'auto_value_matching':'const fareDiff = Math.abs(fare-value);' in s and 'bestScore >= 45' in s,
            'positive_value_only':'if(!tm || value <= 0) continue;' in s,
          }
          print(checks)
          missing=[k for k,v in checks.items() if not v]
          assert not missing, f'missing functional rules: {missing}'
          PY
      - name: Run 99 history video regression
        run: node tools/test_video_reconcile_20260827.js
      - name: Commit result
        run: |
          if git diff --quiet -- index.html; then echo 'No changes; code already applied'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: robust video ride reconciliation v2'
          git push
