name: Inspect video review card
on:
  push:
    paths:
      - '.github/workflows/inspect-video-review-card.yml'
# retrigger 2026-08-26
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/inspect_video_review_card.py
      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _video_review_card_probe.txt
          git commit -m 'Capture video review card context' || exit 0
          git push
