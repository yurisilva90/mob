name: Fix video zero frames v2
on:
  push:
    paths:
      - '.github/workflows/fix-video-zero-frames-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp-fix-video-zero.py
      - run: |
          grep -q "probe.width = 24" index.html
          grep -q "finishSeek(false), 4000" index.html
          grep -q "Nenhum quadro legível foi extraído do vídeo" index.html
          rm -f .tmp-fix-video-zero.py .tmp-video-zero.txt .github/workflows/inspect-video-zero.yml .github/workflows/fix-video-zero-frames.yml .github/workflows/fix-video-zero-frames-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ler frames reais de gravações de tela"
          git push
