name: Corrigir flicker da Jornada
on:
  push:
    paths:
      - '.github/workflows/fix-flicker-jornada.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Banner: só muda quando os dados daquele dia terminaram de carregar.
          old="""  const pcbEl = document.getElementById('pending-confirm-banner');
  if (pcbEl) {
    const pendingCount = autoTripsHoje.filter(t => t.status === 'capturada' || t.status === 'estimada').length;
    if (pendingCount > 0) {
      pcbEl.style.display = 'flex';
      setText('pcb-title', pendingCount + (pendingCount===1 ? ' corrida aguardando confirmação' : ' corridas aguardando confirmação'));
    } else {
      pcbEl.style.display = 'none';
    }
  }
"""
          new="""  const pcbEl = document.getElementById('pending-confirm-banner');
  if (pcbEl) {
    // Não interpreta cache ainda carregando como "zero corridas". Enquanto a
    // consulta está em andamento, mantém o último estado visual válido.
    const autoTripsReady = S._autoTripsDataDate === d;
    if (autoTripsReady) {
      const pendingCount = autoTripsHoje.filter(t => t.status === 'capturada' || t.status === 'estimada').length;
      pcbEl.dataset.dataDate = d;
      if (pendingCount > 0) {
        pcbEl.style.display = 'flex';
        setText('pcb-title', pendingCount + (pendingCount===1 ? ' corrida aguardando confirmação' : ' corridas aguardando confirmação'));
      } else {
        pcbEl.style.display = 'none';
      }
    } else if (pcbEl.dataset.dataDate && pcbEl.dataset.dataDate !== d) {
      // Ao navegar para outro dia, limpa uma única vez o banner do dia anterior;
      // nunca fica escondendo/mostrando durante refresh do mesmo dia.
      pcbEl.style.display = 'none';
      pcbEl.dataset.dataDate = d;
    }
  }
"""
          assert old in s, 'bloco do banner não encontrado'
          s=s.replace(old,new,1)

          # 2) A rotina base deixa de escrever as barras. A timeline V3 é a dona
          # exclusiva destes elementos, evitando 100% Online -> real -> 100%.
          old="""  const jcBd = document.getElementById('jc-breakdown');
  if (jcBd) {
    if (live && liveElapsed > 0) {
      jcBd.style.display = '';
      const liveAutoTrips = autoTripsHoje.filter(t => {
        const ts = autoTripTs(t);
        return ts && ts >= g.start;
      });
      const bd = computeStatusBreakdown(liveElapsed, liveKm, liveAutoTrips);
      setHTML('jc-bar', buildSbarHtml(bd));
      setHTML('jc-blist', buildSrowsHtml(bd));
    } else {
      jcBd.style.display = 'none';
    }
  }

  // Mesma barra, agora no card \"Total do dia\" — soma o dia inteiro
  // (sessões encerradas + sessão ao vivo), então funciona em qualquer
  // data, passada ou de hoje, não só enquanto a jornada está rodando.
  const tdBdRow = document.getElementById('td-bd-row');
  if (tdBdRow) {
    if (totalElapsed > 0) {
      tdBdRow.style.display = '';
      const tdBd = computeStatusBreakdown(totalElapsed, totalKm, autoTripsHoje);
      setHTML('td-bd-bar', buildSbarHtml(tdBd));
      setHTML('td-bd-list', buildSrowsHtml(tdBd));
    } else {
      tdBdRow.style.display = 'none';
    }
  }
"""
          new="""  // Barras de status são renderizadas exclusivamente pela timeline contínua
  // (JOURNEY_CONTINUOUS_OPERATIONAL_V3). A rotina base não toca mais no HTML
  // desses elementos para não sobrescrever a leitura real com o fallback de
  // auto_trips durante cada render da Jornada.
  const jcBd = document.getElementById('jc-breakdown');
  const tdBdRow = document.getElementById('td-bd-row');
"""
          assert old in s, 'bloco legado das barras não encontrado'
          s=s.replace(old,new,1)

          # 3) Desliga o render automático da timeline V2. Mantém a função exposta
          # apenas por compatibilidade; V3 passa a ser a única rotina automática.
          old="""  window.renderStatusTimeline=renderStatusTimeline;

  if(typeof window.renderJornada==='function'){
    const original=window.renderJornada;
    window.renderJornada=function(){
      const r=original.apply(this,arguments);
      setTimeout(renderStatusTimeline,0);
      return r;
    };
  }
  setInterval(renderStatusTimeline,1000);
  setInterval(()=>{ if(S&&S.sec==='jornada'&&S.curDate) loadStatusSegments(S.curDate); },15000);
  setTimeout(renderStatusTimeline,500);
"""
          new="""  // Mantida apenas para compatibilidade/debug. A atualização automática fica
  // exclusivamente a cargo da timeline V3 abaixo, evitando dois renderizadores
  // concorrendo pelos mesmos elementos.
  window.renderStatusTimeline=renderStatusTimeline;
"""
          assert old in s, 'hook automático V2 não encontrado'
          s=s.replace(old,new,1)

          # 4) Dentro da V3, consultas assíncronas atualizam só a área contínua,
          # sem chamar renderJornada() inteiro e reprocessar banner/KPIs.
          marker='<!-- JOURNEY_CONTINUOUS_OPERATIONAL_V3 -->'
          pos=s.index(marker)
          head, v3=s[:pos], s[pos:]
          v3=v3.replace("try{ if(S.sec==='jornada') setTimeout(()=>renderJornada(),0); }catch(e){}",
                        "try{ if(S.sec==='jornada') setTimeout(()=>{renderContinuousSessionList();renderContinuousStatusBars();},0); }catch(e){}")
          v3=v3.replace("try{if(S.sec==='jornada')setTimeout(()=>renderJornada(),0);}catch(e){}",
                        "try{if(S.sec==='jornada')setTimeout(()=>{renderContinuousSessionList();renderContinuousStatusBars();},0);}catch(e){}")

          # 5) Se a consulta ainda não chegou, a V3 não inventa fallback 100% Online.
          old_v3="""  window.journeyBreakdownForSession = function(sess,elapsedSec,kmTotal,fallbackAuto){
    if(!sess?.id) return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);
    ensureJourneyStatus(sess);
    const c=journeyStatusCache.get(journeyKey(sess));
    if(c&&c.rows&&c.rows.length) return statusBreakdownRows(c.rows,elapsedSec,kmTotal,null,null,(S?.gps?.st==='running'?S.gps.sessionId:null));
    return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);
  };
"""
          new_v3="""  window.journeyBreakdownForSession = function(sess,elapsedSec,kmTotal,fallbackAuto){
    if(!sess?.id) return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);
    ensureJourneyStatus(sess);
    const c=journeyStatusCache.get(journeyKey(sess));
    if(c&&c.rows&&c.rows.length) return statusBreakdownRows(c.rows,elapsedSec,kmTotal,null,null,(S?.gps?.st==='running'?S.gps.sessionId:null));
    // Primeira carga: deixa a barra vazia até a timeline real chegar, em vez de
    // exibir 100% Online por alguns milissegundos e depois trocar.
    if(!c || c.loading) return {total:0,online:{sec:0,km:0,pct:0},buscando:{sec:0,km:0,pct:0},corrida:{sec:0,km:0,pct:0}};
    // Só usa o legado se a consulta terminou e confirmou que não há timeline
    // (compatibilidade com jornadas históricas anteriores ao rastreador).
    return computeStatusBreakdown(elapsedSec,kmTotal,fallbackAuto||[]);
  };
"""
          assert old_v3 in v3, 'journeyBreakdownForSession V3 não encontrado'
          v3=v3.replace(old_v3,new_v3,1)

          # 6) A V3 controla visibilidade e preserva o último HTML durante loading.
          old_v3="""  function renderContinuousStatusBars(){
    if(!S?.curDate)return;ensureCivilStatus(S.curDate);
    const c=civilStatusCache.get(S.curDate), rows=c?.rows||[];
    if(rows.length){
      const b=civilDayBounds(S.curDate), bd=statusBreakdownRows(rows,0,0,b.startMs,b.endMs,(S?.gps?.st==='running'?S.gps.sessionId:null));
      const row=document.getElementById('td-bd-row');if(row)row.style.display='';
      try{setHTML('td-bd-bar',buildSbarHtml(bd));setHTML('td-bd-list',buildSrowsHtml(bd));}catch(e){}
    }
    if(S?.gps?.st==='running'&&S.gps.sessionId){
      const sess={id:S.gps.sessionId,start:S.gps.start,end:null,km:S.gps.km||0,elapsed:getElapsed()};
      ensureJourneyStatus(sess);const c2=journeyStatusCache.get(journeyKey(sess));
      if(c2?.rows?.length){const bd=journeyBreakdownForSession(sess,getElapsed(),S.gps.km||0,[]);try{setHTML('jc-bar',buildSbarHtml(bd));setHTML('jc-blist',buildSrowsHtml(bd));}catch(e){}}
    }
  }
"""
          new_v3="""  function renderContinuousStatusBars(){
    if(!S?.curDate)return;
    ensureCivilStatus(S.curDate);
    const c=civilStatusCache.get(S.curDate), rows=c?.rows||[];
    const tdRow=document.getElementById('td-bd-row');
    // Durante loading não toca no DOM: mantém exatamente o último valor válido.
    if(rows.length){
      const b=civilDayBounds(S.curDate), bd=statusBreakdownRows(rows,0,0,b.startMs,b.endMs,(S?.gps?.st==='running'?S.gps.sessionId:null));
      if(tdRow)tdRow.style.display='';
      try{setHTML('td-bd-bar',buildSbarHtml(bd));setHTML('td-bd-list',buildSrowsHtml(bd));}catch(e){}
    } else if(c && !c.loading && tdRow) {
      tdRow.style.display='none';
    }

    const jcRow=document.getElementById('jc-breakdown');
    if(S?.gps?.st==='running'&&S.gps.sessionId){
      const sess={id:S.gps.sessionId,start:S.gps.start,end:null,km:S.gps.km||0,elapsed:getElapsed()};
      ensureJourneyStatus(sess);
      const c2=journeyStatusCache.get(journeyKey(sess));
      if(c2?.rows?.length){
        const bd=journeyBreakdownForSession(sess,getElapsed(),S.gps.km||0,[]);
        if(jcRow)jcRow.style.display='';
        try{setHTML('jc-bar',buildSbarHtml(bd));setHTML('jc-blist',buildSrowsHtml(bd));}catch(e){}
      } else if(c2 && !c2.loading && jcRow) {
        // Jornada sem timeline confirmada (ex.: histórica): não pisca fallback.
        jcRow.style.display='none';
      }
    } else if(jcRow) {
      jcRow.style.display='none';
    }
  }
"""
          assert old_v3 in v3, 'renderContinuousStatusBars V3 não encontrado'
          v3=v3.replace(old_v3,new_v3,1)

          # 7) Atualização visual de 1s somente da barra, sem rerender completo.
          old_v3="""  setTimeout(()=>{try{if(S.sec==='jornada')renderJornada();}catch(e){}},600);
"""
          new_v3="""  setInterval(()=>{try{if(S.sec==='jornada')renderContinuousStatusBars();}catch(e){}},1000);
  setTimeout(()=>{try{if(S.sec==='jornada')renderJornada();}catch(e){}},600);
"""
          assert old_v3 in v3, 'setTimeout final V3 não encontrado'
          v3=v3.replace(old_v3,new_v3,1)

          s=head+v3
          p.write_text(s,encoding='utf-8')
          print('Correções aplicadas.')
          PY
      - name: Validar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Não interpreta cache ainda carregando como "zero corridas"' in s
          assert 'A rotina base não toca mais no HTML' in s
          assert 'dois renderizadores' in s
          assert "setInterval(()=>{try{if(S.sec==='jornada')renderContinuousStatusBars();}catch(e){}},1000);" in s
          # O hook V2 automático antigo precisa ter sumido.
          assert 'setInterval(renderStatusTimeline,1000);' not in s
          print('Validação estrutural OK')
          PY
      - name: Remover temporários e publicar
        run: |
          rm -f .github/workflows/inspect-flicker.yml .github/workflows/fix-flicker-jornada.yml
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html .github/workflows
          git commit -m 'fix: estabiliza barras e aviso da Jornada'
          git push origin main
