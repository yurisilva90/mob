name: Fix Jornada flicker
on:
  push:
    paths:
      - '.github/workflows/fix-flicker-jornada.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/fix-flicker.py
      - name: Commit changes
        run: |
          rm -f .github/fix-flicker.py
          rm -f .github/workflows/inspect-flicker.yml
          rm -f .github/workflows/fix-flicker-jornada.yml
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add index.html .github
          git commit -m 'fix: estabiliza barras e aviso da Jornada'
          git push origin main
